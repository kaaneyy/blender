services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://assetforge:assetforge@postgres:5432/assetforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  blender-worker:
    build:
      context: .
      dockerfile: blender/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - exports:/exports
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetforge
      POSTGRES_PASSWORD: assetforge
      POSTGRES_DB: assetforge
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  exports:
